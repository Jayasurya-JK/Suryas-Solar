<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No internet - Surya's Solar Office</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #f4f6fa; color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        padding: 24px;
      }
      .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 28px 24px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0; font-size: 14px; line-height: 1.6; color: #475569; }
      button { margin-top: 20px; width: 100%; border: 0; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 600; color: #fff; background: #0f4bd6; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>No internet</h1>
      <p>This phone is offline. Quotes and expenses need a connection, so reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
